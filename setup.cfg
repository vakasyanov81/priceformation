[flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true

# Plugins:
max-complexity = 6
max-line-length = 120
max-imports = 18
max-arguments = 6
max-attributes = 8

# We only run wemake-python-styleguide and system checks:
select = WPS, E99

exclude =
    .git,
    .venv,
    .mypy_cache,
    .ruff_cache,
    .pytest_cache,
    htmlcov,
    mutants,
    build,
    dist,



# Intentional project patterns:
# WPS300 — package-relative imports
# WPS615 — public get_* API on parsers/config
# WPS338 — historical method order (public before private)
# WPS601 — class-level caches assigned on instance
# WPS114 — vendor module names with sheet numbers (mim_1sheet)
# WPS115 — template/ANSI uppercase class attributes
# WPS407 — module-level registries/maps
# WPS430 — decorators / small nested helpers
ignore =
    WPS114,
    WPS115,
    WPS300,
    WPS301,
    WPS338,
    WPS407,
    WPS430,
    WPS601,
    WPS615



per-file-ignores =
    # Package __init__ re-exports.
    **/__init__.py: WPS412, WPS410
    # CLI entrypoints.
    src/app/run_dialog/line_fallback.py: WPS421
    src/app/parse_report.py: WPS421
    # Композиционный корень и диспетчер CLI: по функции/ветке на команду.
    src/app/run.py: WPS201, WPS202, WPS235
    src/app/run_machine.py: WPS201, WPS202, WPS235
    # Учётные данные: input() для несекретного логина (пароль — через getpass).
    src/infrastructure/config/mail_credentials.py: WPS421
    # IMAP-адаптер: подключение, перечисление папок и разбор ответов LIST —
    # много небольших протокольных помощников в одном модуле.
    src/infrastructure/mail/imap.py: WPS202
    # HTTP-адаптер МИМ: два запроса (прайс и склады), общий GET и две ошибки — мелкие помощники в одном модуле.
    src/infrastructure/remote/mim_client.py: WPS202
    # SOAP-адаптер Форточек: вызов метода, постраничный обход, разбор XML и сборка строк прайса.
    src/infrastructure/remote/four_tochki_client.py: WPS202
    # Declarative XLS column maps (widths / field keys).
    src/parsers/writer/templates/tmpl/*.py: WPS226, WPS432
    # RowItem — фасад над семью value objects: get/set по плоскому ключу,
    # сериализация и доменные свойства, методов больше лимита by design.
    src/domain/row_item/row_item.py: WPS214
    # Vendor registry: complex config lookup logic, many local branches.
    src/parsers/registry.py: WPS202, WPS110
    # Классификатор типа товара: таблица правил README §2–§9 (формы размеров,
    # спец/TRA/мото/грузовые признаки) — много возвратов, литералов-порогов
    # и сравнений размеров; дробить на микрофункции во вред читаемости.
    src/parsers/strategies/product_type.py: WPS202, WPS204, WPS212, WPS221, WPS231, WPS235, WPS432, WPS459
    # Tests: fixture literals, float asserts, stubs.
    tests/**/*.py: WPS118, WPS201, WPS202, WPS204, WPS210, WPS218, WPS226, WPS229, WPS235, WPS336, WPS339, WPS342, WPS358, WPS420, WPS432, WPS441, WPS459, WPS501
    integration_tests/**/*.py: WPS210, WPS218, WPS226, WPS358, WPS432, WPS459
    # Тест на реальном прайсе: маппинг колонок — большая таблица вендора.
    integration_tests/test_four_tochki_real_price.py: WPS210
    # Local mutmut report CLI: many tiny helpers, status-name literals.
    pipelines/**/*.py: WPS110, WPS202, WPS210, WPS221, WPS226, WPS237, WPS336, WPS358, WPS363, WPS504, WPS527
