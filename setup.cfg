[flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true

# Plugins:
max-complexity = 6
max-line-length = 120

# We only run wemake-python-styleguide and system checks:
select = WPS, E99

# Domain vocabulary of price parsers (WPS110).
allowed-domain-names =
    item,
    items,
    result,
    value,
    values,
    data,
    params,
    file,
    obj,
    val,
    code,
    style,
    field,
    handle,
    visit,
    sheet,

# Intentional project patterns:
# WPS300 — package-relative imports
# WPS615 — public get_* API on parsers/config
# WPS338 — historical method order (public before private)
# WPS601 — class-level caches assigned on instance
# WPS114 — vendor module names with sheet numbers (mim_1sheet)
# WPS115 — template/ANSI uppercase class attributes
# WPS407 — module-level registries/maps
# WPS430 — decorators / small nested helpers
ignore =
    WPS114,
    WPS115,
    WPS300,
    WPS338,
    WPS407,
    WPS430,
    WPS601,
    WPS615

# Limits aligned with existing BaseParser / grouper / templates.
max-methods = 50
max-local-variables = 17
max-cognitive-score = 17
max-jones-score = 19
max-line-complexity = 21
max-imports = 18
max-try-body-length = 4
max-attributes = 8
max-module-members = 16
max-string-usages = 10
max-lines-in-finally = 3
max-returns = 6

per-file-ignores =
    # Package __init__ re-exports.
    **/__init__.py: WPS412, WPS410, WPS411
    # CLI entrypoints.
    src/run.py: WPS457
    src/run_dialog.py: WPS421
    # Logging helper prints by design.
    src/core/log_message.py: WPS421
    # Declarative XLS column maps (widths / field keys).
    src/parsers/writer/templates/tmpl/*.py: WPS226, WPS432
    # Tests: fixture literals, float asserts, stubs.
    tests/**/*.py: WPS202, WPS204, WPS210, WPS211, WPS218, WPS226, WPS231, WPS339, WPS342, WPS358, WPS420, WPS432, WPS441, WPS442, WPS459
