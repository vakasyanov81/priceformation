# Mirrors local quality gates from .cursor/rules/post-change-checks.mdc.
# Tool settings come from pyproject.toml / setup.cfg — do not override flags here.

name: Lint and check types and tests

'on': 
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install project dependency
        run: uv sync --locked --all-extras --dev
      - name: Test coverage
        run: uv run pytest
      - name: Check code by black
        run: uv run black --check --diff .
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Lint with flake8
        run: uv run flake8 .
      - name: Check types with mypy
        run: uv run mypy .
      - name: Find unused code with vulture
        run: uv run vulture
