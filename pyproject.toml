[project]
name = "priceformation"
version = "0.1.0"
description = "A utility for small businesses. It simplifies working with price lists from tire suppliers."
authors = [{ name = "Vladimir Kasyanov", email = "va.kasyanov81@yandex.ru" }]
requires-python = "==3.14.*,<4"
readme = "README.md"
dependencies = [
    "openpyxl==3.1.5",
    "termcolor==3.3.0",
    "colorama==0.4.6",
    "python_calamine==0.8.2",
]

# CLI-точка: `uv run priceformation ...` и короткий алиас `uv run pf ...`.
# Раньше запуск был `uv run python src/run.py`; модуль run лежит в src/ верхним уровнем.
[project.scripts]
priceformation = "run:main"
pf = "run:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "mutmut==3.8.0",
    "pyright==1.1.414",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "ruff==0.16.10",
    "pytest-testmon==2.2.0",
    "pytest-randomly==5.0.0",
    "pytest-xdist==3.8.0",
    "wemake-python-styleguide==1.8.1",
    "mypy==2.3.1",
    "vulture==2.16",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
only-include = ["src"]
sources = ["src"]

[tool.black]
line-length = 120
preview = true
skip-string-normalization = true # we use '
target-version = [ 'py311' ]
# Exclude intentionally bad files:
extend-exclude = '''
(
  tests/.*/__snapshots__/.* | tests/fixtures/.* | mutants/.*
)
'''

[tool.ruff]
line-length = 120
extend-exclude = ["mutants", "pipelines"]

[tool.ruff.lint]
select = ["F", "E", "W", "C90",
          "I", "N", "S", "B", "A",
          "ISC", "T20", "Q", "PTH", "UP",
          "SIM", "RET", "PIE", "RUF",
          "PERF", "PL", "ERA"]
# RUF001–003: кириллица в строках/комментариях похожа на латиницу — ложные срабатывания.
# WPS*: коды flake8-wemake в `# noqa` (иначе RUF102).
ignore = ["RUF001", "RUF002", "RUF003"]
external = ["WPS"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
# Как max-arguments в setup.cfg (WPS).
max-args = 6
max-positional-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "PLC0415"]
"tests/test_infrastructure/test_zapaska_api_config.py" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"tests/test_parsers/test_remote/test_zapaska_client.py" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"integration_tests/*.py" = ["S101", "PLR2004", "PLC0415"]
"integration_tests/**/*.py" = ["S101", "PLR2004", "PLC0415"]
"load_tests/**/*.py" = ["S101", "PLR2004"]
"load_tests/test_make_price_by_supplier.py" = ["S101", "S603", "PLR2004"]
# I001 — keep merged from X import a, b as c to stay under flake8 WPS201 (18 imports).
"src/parsers/base_parser/base_parser.py" = ["I001"]
"src/parse_report.py" = ["T201"]
"src/infrastructure/logging/log_setup.py" = ["T201"]
"src/infrastructure/config/zapaska_api_config.py" = ["S105"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
exclude = [
    "mutants",
    ".venv",
    "htmlcov",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.pytest_cache",
]
reportUnnecessaryTypeIgnoreComment="warning"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "integration_tests",
]

addopts = [
    "--strict-config",
    # pytest-xdist
    "-n=2",
    # pytest-cov: тестовый код не измеряется, список omit — в .coveragerc
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=95",
]
norecursedirs = [
    ".git",
    "build",
    "dist",
]

[tool.mutmut]
source_paths = [ "src/" ]
backup="False"
pytest_add_cli_args = [ "--cov-reset", "-n=0" ]
tests_dir= [ "tests/" ]
mutate_only_covered_lines=true
# Logging modules and call sites: tests do not assert log text.
do_not_mutate = [
    "src/infrastructure/logging/wrappers.py",
    "src/services/async_utils.py",
    "src/infrastructure/logging/console.py",
    "src/infrastructure/logging/exception_logging.py",
    "src/infrastructure/logging/file_logging.py",
    "src/infrastructure/logging/json_mode.py",
    "src/infrastructure/logging/log_resolve.py",
    "src/infrastructure/logging/log_setup.py",
    "src/parsers/base_parser/log_parser_process.py",
]
do_not_mutate_patterns = [
    'logger\.\w+',
    # cast() — аннотация для mypy, в рантайме не выполняет ничего.
    'cast\(',
    # encoding='utf-8' эквивалентен значению по умолчанию, пока локаль UTF-8.
    'encoding=',
    # Тексты argparse: help / description / metavar не влияют на разбор аргументов.
    'help=',
    'description=',
    'metavar=',
    # Описания подкоманд в run_argv._attach_commands передаются позиционно,
    # поэтому help= их не ловит: текст виден только в --help, разбор от него
    # не зависит. Паттерн построчный — покрывает однострочные вызовы.
    '_json_parser\(subparsers, json_flag,',
    # Те же описания в многострочных вызовах: строка-аргумент целиком состоит
    # из help-предложения. Сегодня в src только две такие строки (run_argv).
    '''^\s*'.+\.\',$''',
    # Платформенные константы чтения терминала: тесты подменяют источник
    # символов, эти две строки в тестовом окружении не исполняются.
    '''\.decode\('utf-8', 'ignore'\)''',
    '''import_module\('msvcrt'\)''',
]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
strict = true
local_partial_types = true
warn_unreachable = true
exclude = ["mutants/", "\\.venv/", "tests/test_parsers/test_registry.py", "tests/test_parsers/_registry_import_vendor.py"]

[tool.vulture]
# Scan library and tests together so test-only usage is not reported as dead.
paths = ["src", "tests", "integration_tests", "load_tests", "pipelines"]
exclude = [
    ".venv/",
    "mutants/",
    ".mypy_cache/",
    ".ruff_cache/",
    ".pytest_cache/",
    "htmlcov/",
]
min_confidence = 100
ignore_decorators = ["@pytest.fixture"]

[tool.bandit]
targets = ["src"]
# Exclude tests, mutants, and generated code.
exclude_dirs = [
    "tests",
    "integration_tests",
    "load_tests",
    "mutants",
    "pipelines",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "htmlcov",
]

[tool.pip-audit]
# Audit the current environment (all dev+prod deps).
# Vulnerability service: PyPI JSON API by default.

[tool.importlinter]
# Пакеты лежат в src/, но импортируются как верхний уровень (src в sys.path).
root_packages = ["cfg", "domain", "infrastructure", "parsers", "services"]

# Слои сверху вниз: композиционный корень → сервисы → парсеры → инфраструктура → домен.
# Внутри одного слоя (cfg и services) импорты разрешены, между слоями — только вниз.
[[tool.importlinter.contracts]]
name = "Слои: cfg/services -> parsers -> infrastructure -> domain"
type = "layers"
layers = [
    "cfg",
    "services",
    "parsers",
    "infrastructure",
    "domain",
]
broken_contract_guidance = "Импорт из слоя выше запрещён: развернуть зависимость или передать объект через параметр."

# Строгая форма правил: domain — чистый слой без IO.
[[tool.importlinter.contracts]]
name = "Domain не зависит от инфраструктуры, парсеров, сервисов и композиционного корня"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["infrastructure", "parsers", "services", "cfg"]
broken_contract_guidance = "Домен не знает про внешние слои: описать порт в domain/protocols.py и внести реализацию в infrastructure."

[[tool.importlinter.contracts]]
name = "Инфраструктура не зависит от прикладных слоёв"
type = "forbidden"
source_modules = ["infrastructure"]
forbidden_modules = ["parsers", "services", "cfg"]
broken_contract_guidance = "Инфраструктура — адаптеры: прикладные слои вызывают её, а не наоборот."

[[tool.importlinter.contracts]]
name = "Парсеры не знают про композиционный корень и сервисы"
type = "forbidden"
source_modules = ["parsers"]
forbidden_modules = ["cfg", "services"]
broken_contract_guidance = "Зависимости парсера передаются аргументом или через порт домена; сборку делает src/cfg."

[[tool.importlinter.contracts]]
name = "Сервисы не зависят от композиционного корня"
type = "forbidden"
source_modules = ["services"]
forbidden_modules = ["cfg"]
broken_contract_guidance = "Настройки читать через get_config_provider() или инфраструктурный адаптер, а не импортом из cfg."
