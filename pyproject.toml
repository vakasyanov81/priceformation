[project]
name = "priceformation"
version = "0.1.0"
description = "A utility for small businesses. It simplifies working with price lists from tire suppliers."
authors = [{ name = "Vladimir Kasyanov", email = "va.kasyanov81@yandex.ru" }]
requires-python = "==3.14.*,<4"
readme = "README.md"
dependencies = [
    "openpyxl==3.1.5",
    "termcolor==3.3.0",
    "colorama==0.4.6",
    "python_calamine==0.8.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "mutmut==3.7.0",
    "pyright==1.1.411",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "ruff==0.16.2",
    "pytest-testmon==2.2.0",
    "pytest-randomly==4.1.0",
    "pytest-xdist==3.8.0",
    "wemake-python-styleguide==1.7.1",
    "mypy==2.3.0",
    "vulture==2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
only-include = ["src"]
sources = ["src"]

[tool.black]
line-length = 120
preview = true
skip-string-normalization = true # we use '
target-version = [ 'py311' ]
# Exclude intentionally bad files:
extend-exclude = '''
(
  tests/.*/__snapshots__/.* | tests/fixtures/.* | mutants/.*
)
'''

[tool.ruff]
line-length = 120
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["F", "E", "W", "C90",
          "I", "N", "S", "B", "A",
          "ISC", "T20", "Q", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
"tests/**/*.py" = ["S101"]
"tests/test_cfg/test_zapaska_api.py" = ["S101", "S105", "S106"]
"integration_tests/*.py" = ["S101"]
"integration_tests/**/*.py" = ["S101"]
"load_tests/*.py" = ["S101"]
"load_tests/**/*.py" = ["S101"]
"load_tests/test_make_price_by_supplier.py" = ["S101", "S603"]
"src/core/log_message.py" = ["T201"]
"src/cfg/zapaska_api.py" = ["S105"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
reportUnnecessaryTypeIgnoreComment="warning"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "integration_tests",
]

addopts = [
    "--strict-config",
    # pytest-xdist
    "-n=2",
    # pytest-cov
    "--cov=src",
    "--cov=tests",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=95",
]
norecursedirs = [
    ".git",
    "build",
    "dist",
]

[tool.mutmut]
source_paths = [ "src/" ]
backup="False"
pytest_add_cli_args = [ "--cov-reset", "-n=0" ]
tests_dir= [ "tests/" ]
mutate_only_covered_lines=true
do_not_mutate = [
    "src/core/wrappers.py",
    "src/core/async_utils.py",
]
do_not_mutate_patterns = [
    'logger\.\w+',
]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
strict = true
local_partial_types = true
warn_unreachable = true
exclude = ["mutants/", "\\.venv/"]

[tool.vulture]
# Scan library and tests together so test-only usage is not reported as dead.
paths = ["src", "tests", "integration_tests", "load_tests", "pipelines"]
exclude = [
    ".venv/",
    "mutants/",
    ".mypy_cache/",
    ".ruff_cache/",
    ".pytest_cache/",
    "htmlcov/",
]
min_confidence = 80
ignore_decorators = ["@pytest.fixture"]
