[project]
name = "priceformation"
version = "0.1.0"
description = "A utility for small businesses. It simplifies working with price lists from tire suppliers."
authors = [{ name = "Vladimir Kasyanov", email = "va.kasyanov81@yandex.ru" }]
requires-python = "==3.14.*,<4"
readme = "README.md"
dependencies = [
    "openpyxl==3.1.5",
    "termcolor==3.3.0",
    "colorama==0.4.6",
    "python_calamine==0.8.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "mutmut==3.7.0",
    "pyright==1.1.411",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "ruff==0.16.3",
    "pytest-testmon==2.2.0",
    "pytest-randomly==4.1.0",
    "pytest-xdist==3.8.0",
    "wemake-python-styleguide==1.7.1",
    "mypy==2.3.1",
    "vulture==2.16",
    "mccabe==0.7.0",
    "isort==8.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
only-include = ["src"]
sources = ["src"]

[tool.black]
line-length = 120
preview = true
skip-string-normalization = true # we use '
target-version = [ 'py311' ]
# Exclude intentionally bad files:
extend-exclude = '''
(
  tests/.*/__snapshots__/.* | tests/fixtures/.* | mutants/.*
)
'''

[tool.ruff]
line-length = 120
extend-exclude = ["mutants", "pipelines"]

[tool.ruff.lint]
select = ["F", "E", "W", "C90",
          "I", "N", "S", "B", "A",
          "ISC", "T20", "Q", "PTH", "UP",
          "SIM", "RET", "PIE", "RUF",
          "PERF", "PL", "ERA"]
# RUF001–003: кириллица в строках/комментариях похожа на латиницу — ложные срабатывания.
# WPS*: коды flake8-wemake в `# noqa` (иначе RUF102).
ignore = ["RUF001", "RUF002", "RUF003"]
external = ["WPS"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
# Как max-arguments в setup.cfg (WPS).
max-args = 6
max-positional-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "PLR2004", "PLC0415"]
"tests/**/*.py" = ["S101", "PLR2004", "PLC0415"]
"tests/test_cfg/test_zapaska_api.py" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"tests/test_parsers/test_remote/test_zapaska_client.py" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]
"integration_tests/*.py" = ["S101", "PLR2004", "PLC0415"]
"integration_tests/**/*.py" = ["S101", "PLR2004", "PLC0415"]
"load_tests/*.py" = ["S101", "PLR2004"]
"load_tests/**/*.py" = ["S101", "PLR2004"]
"load_tests/test_make_price_by_supplier.py" = ["S101", "S603", "PLR2004"]
"src/core/log_message.py" = ["T201"]
"src/cfg/zapaska_api.py" = ["S105"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
exclude = [
    "mutants",
    ".venv",
    "htmlcov",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.pytest_cache",
]
reportUnnecessaryTypeIgnoreComment="warning"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "integration_tests",
]

addopts = [
    "--strict-config",
    # pytest-xdist
    "-n=2",
    # pytest-cov
    "--cov=src",
    "--cov=tests",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=95",
]
norecursedirs = [
    ".git",
    "build",
    "dist",
]

[tool.mutmut]
source_paths = [ "src/" ]
backup="False"
pytest_add_cli_args = [ "--cov-reset", "-n=0" ]
tests_dir= [ "tests/" ]
mutate_only_covered_lines=true
# Logging modules and call sites: tests do not assert log text.
do_not_mutate = [
    "src/core/wrappers.py",
    "src/core/async_utils.py",
    "src/core/log_message.py",
    "src/core/log_resolve.py",
    "src/core/init_log.py",
    "src/parsers/base_parser/log_parser_process.py",
]
do_not_mutate_patterns = [
    'logger\.\w+',
    'log_msg\(',
    'print_log\(',
    'warn_msg\(',
    'err_msg\(',
    'need_print_log=',
]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
strict = true
local_partial_types = true
warn_unreachable = true
exclude = ["mutants/", "\\.venv/"]

[tool.vulture]
# Scan library and tests together so test-only usage is not reported as dead.
paths = ["src", "tests", "integration_tests", "load_tests", "pipelines"]
exclude = [
    ".venv/",
    "mutants/",
    ".mypy_cache/",
    ".ruff_cache/",
    ".pytest_cache/",
    "htmlcov/",
]
min_confidence = 100
ignore_decorators = ["@pytest.fixture"]
