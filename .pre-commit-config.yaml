# Same tools as CI / post-change-checks.
# Run via `uv run` so versions match pyproject.toml / uv.lock.
# Settings come from pyproject.toml and setup.cfg — do not override tool flags here.
exclude: ^(mutants/|\.venv/)

repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types_or: [python, pyi]
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: flake8
        name: flake8
        entry: uv run flake8 .
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
        types: [python]
